[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "colla"
version = "0.1.0"
description = "CLI utilities for file and config helpers"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
colla = "colla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
